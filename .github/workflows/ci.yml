name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Unit tests and real-data checks
        run: pytest -q
      - name: Every published number reproduces from the committed data
        run: python analyze.py --check
